<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Hub - AquaSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-green: #10b981;
        }
        .water-gradient {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-green) 100%);
        }
        #map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="water-gradient text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="text-2xl font-bold">🌊 AquaSense</div>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="hover:underline">Home</a>
                    <a href="tracker.html" class="hover:underline">Tracker</a>
                    <a href="drought.html" class="hover:underline">Drought Monitor</a>
                    <a href="recommendations.html" class="hover:underline">Recommendations</a>
                    <a href="community.html" class="hover:underline font-semibold">Community</a>
                </div>
                <button class="md:hidden" id="mobile-menu-btn">☰</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold mb-8 text-center">Community Hub</h1>
        
        <!-- Community Stats -->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-md p-6 text-center">
                <div class="text-4xl font-bold text-blue-600 mb-2" id="total-projects">0</div>
                <div class="text-gray-600">Active Projects</div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6 text-center">
                <div class="text-4xl font-bold text-green-600 mb-2" id="total-participants">0</div>
                <div class="text-gray-600">Participants</div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6 text-center">
                <div class="text-4xl font-bold text-blue-600 mb-2" id="total-impact">0</div>
                <div class="text-gray-600">Liters Saved</div>
            </div>
        </div>

        <!-- Map Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-4">Community Map</h2>
            <div id="map"></div>
            <p class="text-sm text-gray-600 mt-2">Note: Add your Google Maps API key in the JavaScript to enable the map.</p>
        </div>

        <!-- Projects Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold">Community Projects</h2>
                <button id="create-project-btn" class="water-gradient text-white px-6 py-2 rounded-lg font-semibold hover:opacity-90 transition">
                    + Create Project
                </button>
            </div>
            <div id="projects-container" class="space-y-4">
                <!-- Projects will be populated here -->
            </div>
        </div>

        <!-- Create Project Modal -->
        <div id="create-project-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
                <h3 class="text-2xl font-semibold mb-4">Create New Project</h3>
                <form id="project-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Project Name</label>
                        <input type="text" id="project-name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea id="project-description" required rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                        <input type="text" id="project-location" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Project Type</label>
                        <select id="project-type" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <option value="cleanup">Cleanup Drive</option>
                            <option value="harvesting">Rainwater Harvesting</option>
                            <option value="conservation">Conservation Project</option>
                            <option value="education">Education Initiative</option>
                        </select>
                    </div>
                    <div class="flex space-x-4">
                        <button type="submit" class="water-gradient text-white px-6 py-2 rounded-lg font-semibold hover:opacity-90 transition flex-1">
                            Create
                        </button>
                        <button type="button" id="cancel-project-btn" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg font-semibold hover:bg-gray-400 transition flex-1">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 AquaSense. All rights reserved.</p>
        </div>
    </footer>

    <!-- Google Maps API - Replace with your API key -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/community.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
