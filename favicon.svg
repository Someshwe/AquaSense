<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle with water gradient effect -->
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#waterGradient)"/>
  
  <!-- Main water droplet - teardrop shape -->
  <path d="M 32 16 
           C 32 16, 40 18, 40 26
           C 40 30, 36 34, 32 38
           C 28 34, 24 30, 24 26
           C 24 18, 32 16, 32 16 Z" 
        fill="#ffffff" 
        opacity="0.98"
        filter="url(#shadow)"/>
  
  <!-- Highlight on droplet -->
  <ellipse cx="34" cy="22" rx="3" ry="4" fill="#ffffff" opacity="0.6"/>
  
  <!-- Subtle ripple circles -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.25"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
</svg>
