<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AquaSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/enhanced-styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <style>
        .water-gradient {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="water-gradient text-white shadow-lg sticky top-0 z-50 backdrop-blur-sm bg-opacity-95">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="text-2xl font-bold float-animation cursor-pointer" onclick="window.location.href='index.html'">🌊 AquaSense</div>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="nav-link px-3 py-2 rounded-lg hover:bg-white hover:bg-opacity-20 transition-all">Home</a>
                    <a href="tracker.html" class="nav-link px-3 py-2 rounded-lg hover:bg-white hover:bg-opacity-20 transition-all">Tracker</a>
                    <div class="auth-container flex items-center space-x-4 ml-4 pl-4 border-l border-white border-opacity-20"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Settings Container -->
    <div class="container mx-auto px-4 py-16">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-bold mb-8 water-gradient bg-clip-text text-transparent">Settings</h1>
            
            <!-- User Profile Section -->
            <div class="bg-white rounded-xl shadow-lg p-8 mb-6">
                <h2 class="text-2xl font-semibold mb-4 flex items-center">
                    <span class="mr-2">👤</span>
                    Edit Profile
                </h2>
                <p class="text-gray-600 mb-6">Update your personal information</p>
                <div id="profile-section">
                    <p class="text-gray-600">Please log in to view your profile.</p>
                </div>
                <div id="profile-status" class="mt-4"></div>
            </div>
            
            <!-- Certificate Section -->
            <div class="bg-white rounded-xl shadow-lg p-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold flex items-center">
                        <span class="mr-2">🏆</span>
                        Your Certificate
                    </h2>
                    <button onclick="loadCertificateSection()" class="text-sm text-blue-600 hover:text-blue-800 font-semibold px-3 py-1 rounded hover:bg-blue-50 transition-colors">
                        🔄 Refresh
                    </button>
                </div>
                <p class="text-gray-600 mb-6">View and download your water conservation certificate</p>
                <div id="certificate-section">
                    <!-- Certificate preview and download will be shown here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        // Check if user is logged in
        const user = getCurrentUser();
        if (!user) {
            window.location.href = 'auth.html';
        }
        
        // Load user profile
        if (user) {
            document.getElementById('profile-section').innerHTML = `
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                    <input type="text" id="user-name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" value="${user.name || ''}">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="user-email" class="w-full px-4 py-2 border rounded-lg bg-gray-100" value="${user.email}" disabled>
                </div>
                <button onclick="updateUserProfile()" class="water-gradient text-white px-6 py-2 rounded-lg font-semibold hover:opacity-90 transition-opacity">
                    Update Profile
                </button>
            `;
            
            // Load certificate section
            loadCertificateSection();
        }
        
        // Load certificate section
        function loadCertificateSection() {
            const certificateSection = document.getElementById('certificate-section');
            const monthlyTotal = calculateMonthlyTotal();
            const currentUser = getCurrentUser();
            
            if (!currentUser) {
                certificateSection.innerHTML = `
                    <p class="text-gray-600">Please log in to view your certificate.</p>
                `;
                return;
            }
            
            if (monthlyTotal === 0) {
                certificateSection.innerHTML = `
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-lg">
                        <p class="text-gray-700 mb-4">No water savings recorded this month. Submit an impact to generate your certificate!</p>
                        <a href="impact.html" class="inline-block water-gradient text-white px-6 py-2 rounded-lg font-semibold hover:opacity-90 transition-opacity">
                            Submit Impact
                        </a>
                    </div>
                `;
                return;
            }
            
            const userName = currentUser.name || 'Water Conservation Hero';
            
            // Create certificate preview
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            
            // Generate preview (smaller version)
            drawCertificatePreview(ctx, canvas.width, canvas.height, userName, monthlyTotal);
            
            certificateSection.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-br from-blue-50 to-green-50 rounded-lg p-6 border-2 border-blue-200">
                        <h3 class="text-lg font-semibold mb-4 text-center">Certificate Preview</h3>
                        <div class="flex justify-center mb-4">
                            <canvas id="certificate-preview" width="600" height="400" class="border-2 border-gray-300 rounded-lg shadow-lg max-w-full"></canvas>
                        </div>
                        <div class="text-center space-y-2">
                            <p class="text-gray-700">
                                <strong>${formatNumber(monthlyTotal)} liters</strong> saved this month
                            </p>
                            <button onclick="downloadCertificateFromProfile()" class="water-gradient text-white px-8 py-3 rounded-lg font-semibold hover:opacity-90 transition-opacity shadow-lg">
                                🏆 Download Certificate
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Draw preview on the canvas
            const previewCanvas = document.getElementById('certificate-preview');
            if (previewCanvas) {
                const previewCtx = previewCanvas.getContext('2d');
                drawCertificatePreview(previewCtx, previewCanvas.width, previewCanvas.height, userName, monthlyTotal);
            }
        }
        
        // Calculate monthly total water saved
        function calculateMonthlyTotal() {
            const impacts = storage.get('impact_data') || [];
            const currentUser = getCurrentUser();
            
            if (!currentUser) {
                return 0;
            }
            
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            const monthlyImpacts = impacts.filter(impact => {
                if (impact.userId !== currentUser.id) return false;
                const impactDate = new Date(impact.date);
                return impactDate.getMonth() === currentMonth && impactDate.getFullYear() === currentYear;
            });
            
            return monthlyImpacts.reduce((sum, impact) => sum + (impact.liters || 0), 0);
        }
        
        // Draw certificate preview (smaller version)
        function drawCertificatePreview(ctx, width, height, userName, monthlyTotal) {
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#e0f2fe');
            gradient.addColorStop(0.5, '#f0fdf4');
            gradient.addColorStop(1, '#e0f2fe');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Border
            ctx.strokeStyle = '#0ea5e9';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, width - 20, height - 20);
            
            // Title
            ctx.fillStyle = '#0c4a6e';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('CERTIFICATE OF ACHIEVEMENT', width / 2, 60);
            
            // Subtitle
            ctx.fillStyle = '#0369a1';
            ctx.font = 'italic 16px Arial';
            ctx.fillText('Water Conservation Excellence', width / 2, 90);
            
            // User name
            ctx.fillStyle = '#0ea5e9';
            ctx.font = 'bold 24px Arial';
            ctx.fillText(userName.toUpperCase(), width / 2, 150);
            
            // Achievement text
            ctx.fillStyle = '#1e293b';
            ctx.font = '14px Arial';
            ctx.fillText('has saved', width / 2, 180);
            
            // Water saved amount
            ctx.fillStyle = '#10b981';
            ctx.font = 'bold 32px Arial';
            const savedText = formatNumber(monthlyTotal) + ' LITERS';
            ctx.fillText(savedText, width / 2, 230);
            
            // Additional text
            ctx.fillStyle = '#1e293b';
            ctx.font = '12px Arial';
            ctx.fillText('of water during this month', width / 2, 260);
            
            // Date
            const date = new Date();
            const dateText = `Issued on ${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
            ctx.fillStyle = '#64748b';
            ctx.font = '10px Arial';
            ctx.fillText(dateText, width / 2, 300);
            
            // Signature
            ctx.fillStyle = '#64748b';
            ctx.font = '9px Arial';
            ctx.fillText('AquaSense Team', width / 2, 350);
        }
        
        // Download certificate from profile
        function downloadCertificateFromProfile() {
            const currentUser = getCurrentUser();
            if (!currentUser) return;
            
            const monthlyTotal = calculateMonthlyTotal();
            if (monthlyTotal === 0) {
                alert('No water savings recorded this month.');
                return;
            }
            
            const userName = currentUser.name || 'Water Conservation Hero';
            generateCertificate(userName, monthlyTotal);
        }
        
        // Generate full certificate (same as impact.html)
        function generateCertificate(userName, monthlyTotal) {
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#e0f2fe');
            gradient.addColorStop(0.5, '#f0fdf4');
            gradient.addColorStop(1, '#e0f2fe');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Decorative border pattern
            ctx.strokeStyle = '#0ea5e9';
            ctx.lineWidth = 8;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
            
            // Inner border
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 4;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);
            
            // Corner decorations
            ctx.strokeStyle = '#0ea5e9';
            ctx.lineWidth = 3;
            // Top-left corner
            ctx.beginPath();
            ctx.moveTo(60, 90);
            ctx.lineTo(60, 60);
            ctx.lineTo(90, 60);
            ctx.stroke();
            // Top-right corner
            ctx.beginPath();
            ctx.moveTo(canvas.width - 60, 90);
            ctx.lineTo(canvas.width - 60, 60);
            ctx.lineTo(canvas.width - 90, 60);
            ctx.stroke();
            // Bottom-left corner
            ctx.beginPath();
            ctx.moveTo(60, canvas.height - 90);
            ctx.lineTo(60, canvas.height - 60);
            ctx.lineTo(90, canvas.height - 60);
            ctx.stroke();
            // Bottom-right corner
            ctx.beginPath();
            ctx.moveTo(canvas.width - 60, canvas.height - 90);
            ctx.lineTo(canvas.width - 60, canvas.height - 60);
            ctx.lineTo(canvas.width - 90, canvas.height - 60);
            ctx.stroke();
            
            // Water drop decoration (top)
            ctx.fillStyle = '#0ea5e9';
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('💧', canvas.width / 2, 150);
            
            // Title
            ctx.fillStyle = '#0c4a6e';
            ctx.font = 'bold 56px Arial';
            ctx.fillText('CERTIFICATE OF ACHIEVEMENT', canvas.width / 2, 250);
            
            // Subtitle
            ctx.fillStyle = '#0369a1';
            ctx.font = 'italic 32px Arial';
            ctx.fillText('Water Conservation Excellence', canvas.width / 2, 300);
            
            // This certifies text
            ctx.fillStyle = '#1e293b';
            ctx.font = '28px Arial';
            ctx.fillText('This certifies that', canvas.width / 2, 380);
            
            // User name
            ctx.fillStyle = '#0ea5e9';
            ctx.font = 'bold 48px Arial';
            ctx.fillText(userName.toUpperCase(), canvas.width / 2, 450);
            
            // Achievement text
            ctx.fillStyle = '#1e293b';
            ctx.font = '28px Arial';
            ctx.fillText('has saved', canvas.width / 2, 510);
            
            // Water saved amount
            ctx.fillStyle = '#10b981';
            ctx.font = 'bold 64px Arial';
            const savedText = formatNumber(monthlyTotal) + ' LITERS';
            ctx.fillText(savedText, canvas.width / 2, 580);
            
            // Additional text
            ctx.fillStyle = '#1e293b';
            ctx.font = '24px Arial';
            ctx.fillText('of water during this month', canvas.width / 2, 630);
            
            // Date
            const date = new Date();
            const dateText = `Issued on ${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
            ctx.fillStyle = '#64748b';
            ctx.font = '20px Arial';
            ctx.fillText(dateText, canvas.width / 2, 700);
            
            // Signature line
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 - 150, 750);
            ctx.lineTo(canvas.width / 2 + 150, 750);
            ctx.stroke();
            
            ctx.fillStyle = '#64748b';
            ctx.font = '18px Arial';
            ctx.fillText('AquaSense Team', canvas.width / 2, 775);
            
            // Decorative water drops (sides)
            ctx.fillStyle = 'rgba(14, 165, 233, 0.15)';
            ctx.font = '40px Arial';
            ctx.fillText('🌊', 150, 400);
            ctx.fillText('💧', canvas.width - 150, 400);
            
            // Decorative water drops (bottom corners)
            ctx.fillStyle = 'rgba(14, 165, 233, 0.2)';
            ctx.font = '60px Arial';
            ctx.fillText('🌊', 100, 750);
            ctx.fillText('💧', canvas.width - 100, 750);
            
            // Convert to image and download
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `AquaSense_Certificate_${userName.replace(/\s+/g, '_')}_${date.getFullYear()}_${date.getMonth() + 1}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            });
        }
        
        function updateUserProfile() {
            const name = document.getElementById('user-name').value.trim();
            if (!name) {
                showProfileMessage('Name cannot be empty', 'error');
                return;
            }
            
            try {
                updateProfile(name);
                showProfileMessage('Profile updated successfully!', 'success');
                // Update navigation to reflect new name
                if (typeof updateNavigation === 'function') {
                    updateNavigation();
                }
                // Reload certificate section with updated name
                loadCertificateSection();
            } catch (error) {
                showProfileMessage('Failed to update profile: ' + error.message, 'error');
            }
        }
        
        function showProfileMessage(message, type) {
            const statusDiv = document.getElementById('profile-status');
            statusDiv.className = type === 'error' 
                ? 'mt-4 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700'
                : 'mt-4 p-4 rounded-lg bg-green-50 border border-green-200 text-green-700';
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden');
            
            // Hide after 3 seconds for success messages
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.classList.add('hidden');
                }, 3000);
            }
        }
    </script>
</body>
</html>
